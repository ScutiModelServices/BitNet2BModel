# BitNet service: N API replicas behind one nginx address. Each replica runs the model in its own process,
# so RAM use is per replica; the downloaded weights are shared through the models volume.
# Start:  docker compose up -d --build          (callers use http://<host>:9140)
# Scale:  BITNET_REPLICAS=3 docker compose up -d --build, then: docker compose restart bitnet_lb

name: bitnet

services:
  bitnet:
    build: .
    restart: unless-stopped
    mem_limit: ${BITNET_MEM_LIMIT:-0}  # 0 = no cap; a cap makes an out-of-memory kill stay inside this container
    stop_grace_period: 90s  # uvicorn lets running calls finish on SIGTERM; Docker's default 10 s would kill a long answer
    environment:
      BITNET_ADMIN_PASSWORD: ${BITNET_ADMIN_PASSWORD:-}
      BITNET_NUM_THREAD: ${BITNET_NUM_THREAD:-}
      BITNET_REPLICAS: ${BITNET_REPLICAS:-1}  # shown read-only on /admin/
    volumes:
      - models:/models
      - tokens:/data
    deploy:
      replicas: ${BITNET_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9140/health')"]
      interval: 15s
      timeout: 5s
      start_period: 300s
    networks: [bitnet]

  bitnet_lb:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${BITNET_PORT:-9140}:9140"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      bitnet:
        condition: service_healthy
    networks: [bitnet]

volumes:
  models:
  tokens:

networks:
  # Other stacks reach http://bitnet_lb:9140 by joining this network.
  bitnet:
